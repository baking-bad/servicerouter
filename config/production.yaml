# Production platform config (docs/architecture/platform-config.md): mainnets only, real funds.
#
# public: secrets appear by name only, and their values come from the stack's environment.

version: 1
environment: production         # Mainnets only

logger:
  level: info

urls:                           # The temporary domain (P-7)
  website: https://servicerouter.agents.bakingbad.dev
  api: https://api-servicerouter.agents.bakingbad.dev
  pay: https://pay-servicerouter.agents.bakingbad.dev

ownHosts: []

keyPrefixes:
  master: srm_live_
  payment: sr_live_

paymentKeyDefaults:
  dailyBudget: "5"

feeBps: 0                       # P-2: no percentage fee. The flat fee is the cdp facilitator's feePerPayment
routingFeeBps: 0                # P-2, P-9: no routing fee in the MVP

assets:                         # PC-6. Addresses and decimals from the SDKs: @x402/evm, @x402/cardano, viem/tokens
  - name: base-usdc
    network: eip155:8453        # Base
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    decimals: 6
    peg: usd
    payTo: "0x5d0b54076191062bea66176c6a0c94ab3aeafb26"          # Our Base address that receives USDC
  - name: cardano-usdm
    network: cardano:mainnet
    address: c48cbb3d5e57ed56e276bc45f99ab39abe94e6cd7ac39fb402da47ad.0014df105553444d
    decimals: 6
    peg: usd
    minPrice: "0.05"            # PR-3: Cardano's network fee makes smaller calls uneconomic
    payTo: "addr1q97yhwkk46wcdz24za643jeme4n9gu7m6v74vkqacy66v3cee07nknkut5k5xw4w7t5aj78a26aw0xw2cn2jcmj9mcxsugtysy"       # Our Cardano address that receives USDM
  - name: tempo-usdce           # P-3: USDC.e only. MPP only (PR-9)
    network: eip155:4217        # Tempo
    address: "0x20C000000000000000000000b9537d11c60E8b50"
    decimals: 6
    peg: usd
    payTo: "0x5d0b54076191062bea66176c6a0c94ab3aeafb26"        # The same address as mpp.recipient

facilitators:
  - name: cdp
    url: https://api.cdp.coinbase.com/platform/v2/x402
    networks: [eip155:8453]     # Solana later (P-6)
    auth:
      type: cdp
      apiKeyId: CDP_API_KEY_ID
      apiKeySecret: CDP_API_KEY_SECRET
    feePerPayment: "0.0005"     # P-2: half of CDP's $0.001 settlement fee, on each x402 payment it settles, from the seller's earnings
  - name: cardano
    url: http://cardano-facilitator:4022   # The stack's service by its short name. Not <STACK_NAME>_…: its Tomcat answers 400 to a Host with an underscore
    networks: [cardano:mainnet]

mpp:
  network: eip155:4217          # Tempo
  recipient: "0x5d0b54076191062bea66176c6a0c94ab3aeafb26"      # Our Tempo address that receives USDC.e

deposits:                       # Buyers top up credits with USDM on Cardano
  asset: cardano-usdm
  confirmations: 15

payouts:
  assets: [cardano-usdm]
  minimum: "10"

categories:                     # CI-3. Shaped by what agents buy over x402 today: crypto data, DeFi, chain reads, AI, and search
  # Crypto market data: the second-largest cluster of x402 calls
  - id: crypto
    title: Crypto
  - id: crypto/prices
    title: Prices and market data
  - id: crypto/token-analytics
    title: Token analytics and smart money
  - id: crypto/derivatives
    title: Derivatives, funding, and liquidations
  - id: crypto/trading-signals
    title: Trading signals
  - id: crypto/security
    title: Token safety and risk
  - id: crypto/news
    title: News and sentiment
  # DeFi: actions and positions, not only prices
  - id: defi
    title: DeFi
  - id: defi/swaps
    title: Swap quotes and routing
  - id: defi/yields
    title: Yields and lending rates
  - id: defi/protocols
    title: Protocols, pools, and TVL
  - id: defi/portfolio
    title: Wallets and portfolios
  # Chain reads: the widest adoption among x402 payers
  - id: blockchain
    title: Blockchain
  - id: blockchain/rpc
    title: Node RPC
  - id: blockchain/indexed-data
    title: Indexed data and queries
  - id: blockchain/explorers
    title: Transactions, balances, and explorers
  - id: blockchain/nft
    title: NFTs
  - id: blockchain/names
    title: Names and identity
  - id: ai
    title: AI
  - id: ai/llm
    title: Language models
  - id: ai/image-generation
    title: Image generation
  - id: ai/speech
    title: Speech and audio
  - id: ai/embeddings
    title: Embeddings
  - id: ai/translation
    title: Translation
  # Search and web data: the largest x402 category by calls
  - id: search
    title: Search and web data
  - id: search/web
    title: Web search
  - id: search/scraping
    title: Crawling and scraping
  - id: search/social
    title: Social media
  - id: data
    title: Data
  - id: data/people-companies
    title: People and companies
  - id: data/markets
    title: Stocks and FX
  - id: data/geo
    title: Maps and geocoding

rateLimits:
  paymentKey: { requests: 600, windowSeconds: 60 }
  service: { requests: 6000, windowSeconds: 60 }
  unpaidIp: { requests: 60, windowSeconds: 60 }
  signup: { requests: 200, windowSeconds: 3600 }  # P-5: a hackathon venue shares one IP
  # The website's server reads these for every visitor, from one IP
  documents: { requests: 600, windowSeconds: 60 }  # The catalog and agent documents
  topup: { requests: 300, windowSeconds: 60 }

timeouts:
  connectMs: 5000
  requestMs: 30000
  settleMs: 30000

signer:                         # Payment routing's hot wallet (P-9). These cap a routing loss (RT-9)
  maxPerCall: "0.1"
  maxPerNetworkPerHour: "5"
  maxPerNetworkPerDay: "20"
