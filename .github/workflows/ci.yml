name: CI

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - 'docs/**'
      - 'demo/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'demo/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build and push the image after the checks pass.'
        type: boolean
        required: false
        default: true

# Every pushed commit gets its own image (stacks deploy by commit SHA), so only PR runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services: &test-services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: servicerouter
          POSTGRES_PASSWORD: servicerouter
          POSTGRES_DB: servicerouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicerouter -d servicerouter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services: *test-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run functional tests
        run: npm run test:functional

  publish:
    name: Build and push image
    needs:
      - build
      - unit
      - integration
      - functional
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
